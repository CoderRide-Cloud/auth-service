server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/coder_ride_auth
    username: coderride
    password: password
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET:thisisaverysecuresecretkeythatisverylongandsecure!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

github:
  client-id: ${GITHUB_CLIENT_ID:YOUR_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET:YOUR_CLIENT_SECRET}

